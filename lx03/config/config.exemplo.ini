; ============================================================================
; Configuração das integrações do Dashboard LX03
; ============================================================================
; Copie este arquivo para "config.ini" (mesma pasta) e preencha o que for
; usar. O "config.ini" real NÃO é versionado no Git (veja .gitignore) —
; é o lugar certo para credenciais, diferente deste arquivo de exemplo.
;
; Cada seção tem "ativo = true/false". Enquanto estiver "false" (ou o
; arquivo config.ini não existir), o script simplesmente pula aquela
; integração e avisa no terminal — nada quebra por falta de configuração.
; ============================================================================

[email]
ativo = false
; Servidor SMTP da empresa (Office 365, Gmail Workspace, etc.)
servidor_smtp = smtp.office365.com
porta = 587
usuario =
senha =
; se "usuario" já for o e-mail, pode repetir aqui ou deixar em branco
remetente =
; e-mails separados por vírgula
destinatarios =

[teams]
ativo = false
; Canal do Teams > ... > Conectores > Webhook de Entrada > copiar URL
webhook_url =

[alertas]
; só envia e-mail/Teams quando algum indicador piorou frente à carga
; anterior (comparando com o histórico salvo em tendencia.db)
somente_quando_piora = true
; envia sempre que houver pelo menos 1 posição vencida, mesmo sem piora
sempre_alertar_se_vencido = true

[sap_odata]
; conexão direta ao SAP via serviço OData (alternativa a exportar a LX03
; manualmente) — peça a URL do serviço e um usuário de leitura ao time de
; Basis/SAP. Formato esperado do serviço: ver lx03/scripts/conector_sap.py
ativo = false
url_servico =
usuario =
senha =
verificar_ssl = true

[sap_rfc]
; alternativa via RFC (SAP NetWeaver RFC SDK + pacote "pyrfc") — use só se
; o time de Basis preferir RFC a OData. Requer instalação separada do SDK
; da SAP (não é possível distribuir junto por licenciamento).
ativo = false
ashost =
sysnr = 00
client =
usuario =
senha =

[google_sheets]
ativo = false
; caminho para o arquivo JSON da conta de serviço do Google Cloud
; (Google Cloud Console > IAM > Contas de serviço > Chaves > Criar chave JSON)
; e compartilhe a planilha de destino com o e-mail dessa conta de serviço.
arquivo_credenciais = config/google_credentials.json
id_planilha =

[power_bi]
; publicação no Power BI via API REST (push para um dataset) — exige um
; App Registration no Azure AD com permissão Power BI Service.
; Alternativa sem código: abrir o Power BI Desktop, "Obter Dados > Excel",
; apontar para lx03/dashboard/Dashboard_Estoque_LX03.xlsx numa pasta
; compartilhada (OneDrive/SharePoint) e configurar atualização agendada —
; veja lx03/GUIA_POWER_BI.md.
ativo = false
tenant_id =
client_id =
client_secret =
workspace_id =
dataset_id =
table_name = PontosDeAtencao
